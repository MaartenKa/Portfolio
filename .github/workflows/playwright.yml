name: Playwright Tests

on:
  # 1 poging per dag, om 18:17 UTC.
  #
  # GitHub's scheduler is best-effort en dropt jobs onder belasting, met name
  # rond de top van het uur. Gemeten met een test-cron (4x per uur op
  # :07/:22/:37/:52): 2 runs uit 42 verwachte triggers = ~5%. Met één dagelijkse
  # run is een gemiste run dus goed mogelijk; gebruik workflow_dispatch om dat
  # op te vangen.

  schedule:
    - cron: "17 18 * * *"

  # Push-trigger staat UIT. Ik draai de tests zelf handmatig bij een push.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'playwright/**'
  #     - 'src/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'playwright.config.ts'
  #     - '.github/workflows/playwright.yml'

  # Handmatig starten via GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest

    env:
      CI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # Kwaliteitspoorten vóór de tests: een rode typecheck, lint of HTML-structuur
      # moet de suite niet halen (TESTPLAN.md §11, entry-criteria). Ze draaien vóór
      # de browserinstall, zodat een defect direct faalt zonder download-kosten.
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: HTML-validate (docs/**/*.html)
        run: npm run validate:html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

      - name: Generate Playwright history
        if: ${{ !cancelled() }}
        env:
          CI_SUMMARY_STATUS: ${{ job.status }}
        run: >
          node scripts/ci-summary.mjs
          --report=playwright/test-results/report.json
          --history=docs/data/playwright-history.json
          --max=30

      - name: Upload Playwright JSON report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && hashFiles('playwright/test-results/report.json') != '' }}
        with:
          name: playwright-json-report
          path: playwright/test-results/report.json
          retention-days: 30

      - name: Upload Playwright history
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-history
          path: docs/data/playwright-history.json
          retention-days: 30

      - name: Commit Playwright history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref }}
          git add docs/data/playwright-history.json
          git diff --cached --quiet || git commit -m "chore(ci): update Playwright history [skip ci]"
          git push origin HEAD:${{ github.ref }}
