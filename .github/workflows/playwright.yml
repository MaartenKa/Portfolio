name: Playwright Tests

on:
  # 4 pogingen per dag, elke 6 uur, op :17.
  #
  # Waarom niet één tijdstip: GitHub's scheduler is best-effort en dropt jobs
  # onder belasting, met name rond de top van het uur. Gemeten met een test-cron
  # (4x per uur op :07/:22/:37/:52): 2 runs uit 42 verwachte triggers = ~5%

  schedule:
    - cron: "17 0,6,12,18 * * *"

  # Push-trigger staat UIT. Ik draai de tests zelf handmatig bij een push.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'playwright/**'
  #     - 'src/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'playwright.config.ts'
  #     - '.github/workflows/playwright.yml'

  # Handmatig starten via GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest

    env:
      CI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30
