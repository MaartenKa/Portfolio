name: Playwright Tests

on:
  # Eén run per dag, om 18:17 UTC.
  #
  # De GitHub-scheduler is best-effort en laat jobs onder belasting vallen,
  # vooral rond het hele uur. Een meting met een test-cron (vier keer per uur op
  # :07, :22, :37 en :52) gaf 2 runs uit 42 verwachte triggers, ongeveer 5%.
  # Bij één dagelijkse run is een gemiste run dus goed mogelijk; gebruik
  # workflow_dispatch om dat op te vangen.

  schedule:
    - cron: "17 18 * * *"

  # De push-trigger staat bewust uit; de tests worden handmatig bij een push
  # gedraaid. Onderstaand blok is een voorbeeld om de trigger weer aan te zetten.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'playwright/**'
  #     - 'src/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'playwright.config.ts'
  #     - '.github/workflows/playwright.yml'

  # Handmatig starten via GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write
  # upload-artifact@v7 vereist de `actions`-scope. Niet-genoemde scopes vallen
  # terug op de impliciete standaard `read`; de upload-stappen falen dan.
  # Daarom staat deze scope expliciet in de workflow.
  actions: write

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest

    # Beschermt tegen een run die door een haperende browserdownload of een
    # vastgelopen suite tegen de 60-minutenlimiet van GitHub aanloopt.
    timeout-minutes: 20

    env:
      CI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # De Node-versie komt uit package.json (engines.node): één veld, twee
          # consumenten. npm toetst het en setup-node lost het op. `lts/*` schuift
          # mee met de runner-images en wijkt daardoor lokaal af van de CI.
          # Zie PLAN-DEPENDENCY-UPGRADES.md §6.
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Kwaliteitspoorten vóór de tests: een rode typecheck, lint of
      # HTML-structuur mag de suite niet halen (TESTPLAN.md §11, entry-criteria).
      # Ze draaien vóór de browserinstallatie, zodat een defect direct faalt
      # zonder downloadkosten.
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: HTML-validate (docs/**/*.html)
        run: npm run validate:html

      # Preflight: een 503/timeout van GitHub Pages is een omgevingsfout,
      # geen testflake. De tests starten pas als alle live pagina's 200 geven.
      - name: Check live site availability
        run: npm run check:site
        env:
          SITE_BASE_URL: https://maartenka.github.io/Portfolio/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('playwright/playwright-report/**') != '' }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

      - name: Generate Playwright history
        if: ${{ !cancelled() }}
        env:
          CI_SUMMARY_STATUS: ${{ job.status }}
        run: >
          node scripts/ci-summary.mjs
          --report=playwright/test-results/report.json
          --history=docs/data/playwright-history.json
          --max=30

      - name: Upload Playwright JSON report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('playwright/test-results/report.json') != '' }}
        with:
          name: playwright-json-report
          path: playwright/test-results/report.json
          retention-days: 30

      - name: Upload Playwright history
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-history
          path: docs/data/playwright-history.json
          retention-days: 30

      - name: Commit Playwright history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref }}
          git add docs/data/playwright-history.json
          git diff --cached --quiet || git commit -m "chore(ci): update Playwright history [skip ci]"
          git push origin HEAD:${{ github.ref }}
